    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>
    let num = Number(prompt("Введіть число:"));

    let sign = num < 0 ? -1 : 1;
    let n = Math.abs(num);
    let reversed = 0;

    while (n > 0) {
        let digit = n % 10;
        reversed = reversed * 10 + digit;
        n = Math.floor(n / 10);
    }

    alert("Результат: " + reversed * sign);
</script>
</body>
</html>
